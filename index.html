<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>🕹️ 인형뽑기</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 560px at 50% -12%, #40226f 0%, rgba(64,34,111,0) 62%),
      radial-gradient(760px 460px at 86% 112%, #6b1f5b 0%, rgba(107,31,91,0) 60%),
      radial-gradient(600px 400px at 8% 104%, #1c3f6b 0%, rgba(28,63,107,0) 60%),
      #120a24;
    display:flex; justify-content:center; align-items:center;
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
    color:#fff; overflow:hidden; overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased;
  }
  .app{
    width:100%; max-width:460px; height:100vh; height:100dvh; max-height:940px;
    display:flex; flex-direction:column; justify-content:center; gap:8px; padding:8px 10px 12px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
  }

  /* ---------- marquee ---------- */
  .marquee{
    position:relative; flex:0 0 auto; border-radius:16px 16px 12px 12px;
    padding:11px 10px 8px; text-align:center; overflow:hidden;
    background:linear-gradient(180deg,#341a63,#1b0b36 70%,#2a1150);
    border:2px solid rgba(255,110,190,.45);
    box-shadow:0 0 20px rgba(255,95,162,.30), inset 0 0 22px rgba(180,80,255,.22);
  }
  .marquee::before{
    content:""; position:absolute; left:10px; right:10px; top:4px; height:6px;
    background-image:radial-gradient(circle, #ffe066 1.5px, rgba(255,224,102,0) 2.2px);
    background-size:13px 7px; background-repeat:repeat-x;
    animation:bulbs 1.1s infinite alternate;
  }
  @keyframes bulbs{from{opacity:.42}to{opacity:1}}
  .marquee h1{
    margin:2px 0 0; font-size:clamp(19px,5.6vw,25px); font-weight:900;
    letter-spacing:.16em; color:#fff6ff;
    text-shadow:0 0 5px #ff5fa2, 0 0 14px #ff2d8f, 0 0 30px rgba(255,45,143,.85);
  }
  .marquee p{
    margin:1px 0 0; font-size:9px; letter-spacing:.42em; font-weight:800;
    color:#8fe9ff; text-shadow:0 0 10px rgba(95,224,255,.85); opacity:.9;
  }

  /* ---------- hud ---------- */
  .hud{flex:0 0 auto; display:flex; gap:7px; align-items:stretch}
  .pill{
    flex:1; display:flex; align-items:center; justify-content:center; gap:5px;
    padding:6px 6px; border-radius:11px; font-size:11px; font-weight:800;
    letter-spacing:.04em; color:#cfc4ee; white-space:nowrap;
    background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.16);
    font-variant-numeric:tabular-nums;
  }
  .pill b{font-size:15px; color:#ffe066; text-shadow:0 0 10px rgba(255,224,102,.65)}
  .pill.coin b{color:#ffd166}
  .iconbtn{
    flex:0 0 auto; width:42px; border-radius:11px; border:1px solid rgba(255,255,255,.18);
    background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
    color:#fff; font-size:18px; line-height:1; cursor:pointer;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .iconbtn:active{transform:scale(.95)}

  /* ---------- stage ---------- */
  .stage{
    position:relative; flex:1 1 auto; min-height:0; max-height:520px;
    border-radius:18px; overflow:hidden;
    background:#150b2c;
    border:3px solid #3b2468;
    box-shadow:0 12px 30px rgba(0,0,0,.55), inset 0 0 44px rgba(120,60,255,.28), 0 0 0 1px rgba(255,255,255,.06);
  }
  #game{position:absolute; inset:0; display:block; width:100%; height:100%}
  .glass{
    position:absolute; inset:0; pointer-events:none; border-radius:15px;
    background:
      linear-gradient(116deg, rgba(255,255,255,.17) 0%, rgba(255,255,255,.05) 16%, rgba(255,255,255,0) 33%),
      linear-gradient(116deg, rgba(255,255,255,0) 56%, rgba(255,255,255,.10) 64%, rgba(255,255,255,0) 73%),
      radial-gradient(120% 70% at 50% 0%, rgba(120,200,255,.13), rgba(120,200,255,0) 60%);
  }
  .glass::after{
    content:""; position:absolute; inset:0; border-radius:15px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.09), inset 0 -24px 34px rgba(0,0,0,.42);
  }

  /* ---------- claw strength ---------- */
  .power{flex:0 0 auto; display:flex; align-items:center; gap:8px}
  .plabel{
    font-size:9.5px; font-weight:900; letter-spacing:.08em; color:#9d8bc9;
    white-space:nowrap; text-transform:uppercase;
  }
  .seg{
    flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:3px; padding:3px;
    border-radius:12px; background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.13);
  }
  .sev{
    padding:5px 0; border:none; border-radius:9px; background:transparent;
    color:#9a89c6; font-family:inherit; font-size:11px; font-weight:900;
    letter-spacing:.02em; cursor:pointer; touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    transition:background .16s ease, color .16s ease, box-shadow .16s ease;
  }
  .sev:active{transform:scale(.97)}
  .sev.on{color:#1a0c2e}
  .sev.on[data-s="weak"]{background:#5fe0ff; box-shadow:0 0 13px rgba(95,224,255,.6)}
  .sev.on[data-s="normal"]{background:#c3aaff; box-shadow:0 0 13px rgba(190,160,255,.55)}
  .sev.on[data-s="strong"]{background:#ffe066; box-shadow:0 0 14px rgba(255,224,102,.6)}

  /* ---------- controls : arcade joystick ---------- */
  .controls{
    flex:0 0 auto; display:grid; grid-template-columns:146px minmax(0,1fr);
    gap:10px; align-items:center;
  }

  .joy{
    position:relative; height:138px; --lx:0; --rx:0; --mag:0;
    cursor:grab; touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .joy.dragging{cursor:grabbing}

  /* 네온 번짐 */
  .joy-halo{
    position:absolute; left:50%; bottom:-8px; width:142px; height:142px;
    transform:translateX(-50%); border-radius:50%; pointer-events:none;
    background:radial-gradient(circle,
      rgba(255,95,170,.40) 0%, rgba(175,80,255,.20) 44%, rgba(120,60,255,0) 70%);
    opacity:calc(.42 + var(--mag) * .58);
  }

  /* 금속 베젤 */
  .joy-plate{
    position:absolute; left:50%; bottom:0; width:124px; height:124px;
    transform:translateX(-50%); border-radius:50%;
    background:
      radial-gradient(118% 118% at 50% 16%, rgba(255,255,255,.26), rgba(255,255,255,0) 46%),
      conic-gradient(from 212deg, #3d2c68, #190f2e 22%, #48356f 50%, #190f2e 78%, #3d2c68 100%);
    box-shadow:
      0 0 0 1.5px rgba(255,110,190,.55),
      0 0 18px rgba(255,95,162,.30),
      0 9px 20px rgba(0,0,0,.55),
      inset 0 2px 1px rgba(255,255,255,.22),
      inset 0 -9px 18px rgba(0,0,0,.62);
  }

  /* 파여 있는 원형 게이트 */
  .joy-gate{
    position:absolute; inset:7px; border-radius:50%;
    background:radial-gradient(circle at 50% 34%, #2d1d52 0%, #150b29 58%, #0a0417 100%);
    box-shadow:
      inset 0 4px 10px rgba(0,0,0,.9),
      inset 0 -2px 0 rgba(255,255,255,.09),
      0 1px 0 rgba(255,255,255,.14);
  }
  .joy-gate::before{
    content:""; position:absolute; inset:8px; border-radius:50%;
    background:conic-gradient(from 0deg,
      rgba(255,255,255,.13), rgba(255,255,255,0) 22%, rgba(255,255,255,.13) 47%,
      rgba(255,255,255,0) 72%, rgba(255,255,255,.13) 97%);
    -webkit-mask:radial-gradient(circle, rgba(0,0,0,0) 61%, #000 63%, #000 73%, rgba(0,0,0,0) 75%);
            mask:radial-gradient(circle, rgba(0,0,0,0) 61%, #000 63%, #000 73%, rgba(0,0,0,0) 75%);
    opacity:.6;
  }
  .joy-arrow{
    position:absolute; top:50%; margin-top:-8px; line-height:1;
    font-size:11px; font-weight:900; color:#9ff0ff;
    text-shadow:0 0 10px rgba(95,224,255,1), 0 0 3px rgba(255,255,255,.95);
    pointer-events:none;
  }
  .joy-arrow.l{left:12px; opacity:calc(.22 + var(--lx) * .78)}
  .joy-arrow.r{right:12px; opacity:calc(.22 + var(--rx) * .78)}

  /* 축 받침 */
  .joy-collar{
    position:absolute; left:50%; bottom:55px; width:36px; height:16px; margin-left:-18px;
    border-radius:50%; pointer-events:none;
    background:
      radial-gradient(58% 66% at 50% 26%, #a292cf 0%, #5a4a86 40%, #241640 78%, #180e2c 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.55),
      inset 0 -2px 3px rgba(0,0,0,.6),
      0 3px 8px rgba(0,0,0,.72),
      0 0 0 1px rgba(255,255,255,.09);
  }

  /* 스틱 (금속 샤프트 + 글로시 볼) */
  .joy-stick{position:absolute; left:50%; bottom:62px; width:0; height:0}
  .joy-rod{
    position:absolute; left:0; bottom:0; width:13px; margin-left:-6.5px; height:32px;
    transform-origin:50% 100%; border-radius:7px 7px 3px 3px;
    background:linear-gradient(90deg,
      #23222f 0%, #6d6c8d 14%, #c9c9e2 32%, #ffffff 46%, #e2e2f4 54%, #9c9bbb 72%, #5a5975 88%, #1e1d28 100%);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.5), 0 0 8px rgba(0,0,0,.55);
  }
  .joy-rod::after{
    content:""; position:absolute; left:0; right:0; bottom:-2px; height:9px;
    background:linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,0));
    border-radius:7px;
  }
  .joy-ball{
    position:absolute; left:0; top:0; width:38px; height:38px; margin:-19px 0 0 -19px;
    border-radius:50%; pointer-events:none;
    background:
      radial-gradient(circle at 34% 23%, rgba(255,255,255,.98) 0%, rgba(255,255,255,.55) 9%, rgba(255,255,255,0) 28%),
      radial-gradient(circle at 68% 80%, rgba(255,150,200,.55) 0%, rgba(255,150,200,0) 40%),
      radial-gradient(circle at 48% 40%, #ff5aa6 0%, #ef2179 34%, #c4115f 62%, #8d0a45 84%, #5e0630 100%);
    box-shadow:
      0 8px 14px rgba(0,0,0,.62),
      0 0 20px rgba(255,60,150,.55),
      inset -3px -5px 9px rgba(70,0,35,.45),
      inset 0 0 0 1px rgba(255,190,220,.30),
      inset 2px 3px 6px rgba(255,255,255,.25);
  }
  .joy-ball::after{
    content:""; position:absolute; left:20%; top:11%; width:34%; height:24%;
    border-radius:50%; filter:blur(1px);
    background:radial-gradient(circle, rgba(255,255,255,.9), rgba(255,255,255,0) 76%);
  }
  .joy.dragging .joy-ball{filter:brightness(1.12) saturate(1.08)}

  /* 집기 버튼 */
  #drop{
    height:100px; border:none; border-radius:20px; font-family:inherit; font-weight:900;
    color:#3a1400; cursor:pointer; touch-action:manipulation; font-size:24px; letter-spacing:.05em;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#ffe680,#ffa53d 58%,#ff7a2f);
    box-shadow:0 6px 0 #b85a13, 0 12px 22px rgba(255,120,40,.42), inset 0 2px 0 rgba(255,255,255,.85);
    text-shadow:0 1px 0 rgba(255,255,255,.45);
    transition:transform .06s ease, box-shadow .06s ease, filter .12s ease;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  }
  #drop .sub{font-size:8px; font-weight:900; letter-spacing:.3em; opacity:.55; margin-top:2px}
  #drop:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #b85a13, 0 4px 10px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.6);
  }
  #drop.busy{filter:saturate(.55) brightness(.85); pointer-events:none}

  /* ---------- bottom row ---------- */
  .bottom{flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .mini{
    padding:9px 6px; border-radius:12px; font-family:inherit; font-weight:800; font-size:12px;
    color:#e7ddff; cursor:pointer; touch-action:manipulation;
    background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.2); letter-spacing:.02em;
  }
  .mini:active{transform:translateY(2px)}
  #refill.hot{
    color:#3a1200; border-color:rgba(255,214,102,.85);
    background:linear-gradient(180deg,#ffe680,#ffb03d);
    box-shadow:0 0 18px rgba(255,190,70,.65);
  }
  #refill.pulse{animation:pulse .5s ease 2}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:26%; transform:translate(-50%,10px) scale(.96);
    max-width:88vw; padding:9px 15px; border-radius:999px; pointer-events:none;
    font-size:13px; font-weight:800; color:#241041; white-space:nowrap;
    background:rgba(255,246,220,.97); box-shadow:0 8px 22px rgba(0,0,0,.4);
    opacity:0; transition:opacity .2s ease, transform .2s ease; z-index:40;
  }
  #toast.show{opacity:1; transform:translate(-50%,0) scale(1)}

  /* ---------- modal ---------- */
  .modal{
    position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
    padding:16px; background:rgba(9,4,20,.72); backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .modal.open{display:flex}
  .modal-card{
    width:100%; max-width:420px; max-height:86vh; display:flex; flex-direction:column;
    border-radius:20px; padding:14px; overflow:hidden;
    background:linear-gradient(180deg,#2a1550,#180c30);
    border:2px solid rgba(255,110,190,.5);
    box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 0 40px rgba(160,80,255,.18);
  }
  .modal-head{display:flex; align-items:center; justify-content:space-between; gap:8px; flex:0 0 auto}
  .modal-head h2{
    margin:0; font-size:17px; font-weight:900; letter-spacing:.04em; color:#fff;
    text-shadow:0 0 12px rgba(255,95,162,.7);
  }
  .modal-head button{
    width:32px; height:32px; border-radius:10px; border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.1); color:#fff; font-size:14px; cursor:pointer;
  }
  .progress{
    flex:0 0 auto; margin:8px 0 10px; font-size:11px; font-weight:700; color:#b9a9e6; letter-spacing:.02em;
  }
  .grid{
    flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding-right:2px;
  }
  .card{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:7px 4px 6px; border-radius:12px;
    background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.12);
  }
  .card.locked canvas{filter:grayscale(1) brightness(.32) opacity(.75)}
  .card.locked .cname{color:#6e5f96}
  .cname{font-size:11px; font-weight:800; color:#fff; letter-spacing:-.01em}
  .crar{font-size:9px; font-weight:900; letter-spacing:.06em; padding:1px 5px; border-radius:6px}
  .crar.r1{color:#9fe0ff; background:rgba(95,180,255,.16)}
  .crar.r2{color:#c7a6ff; background:rgba(170,120,255,.18)}
  .crar.r3{color:#ffd166; background:rgba(255,190,60,.18)}
  .ccnt{font-size:10px; font-weight:800; color:#8ee6a0; font-variant-numeric:tabular-nums}
  .card.locked .ccnt{color:#5a4d7d}
</style>
</head>
<body>
<div class="app">
  <header class="marquee">
    <h1>인 형 뽑 기</h1>
    <p>CLAW MACHINE</p>
  </header>

  <div class="hud">
    <div class="pill">⭐ <b id="score">0</b></div>
    <div class="pill coin">🪙 <b id="coins">5</b></div>
    <button class="iconbtn" id="mute" aria-label="소리 켜기/끄기">🔊</button>
  </div>

  <div class="stage" id="stage">
    <canvas id="game"></canvas>
    <div class="glass"></div>
  </div>

  <div class="power">
    <span class="plabel">집게 강도</span>
    <div class="seg">
      <button class="sev" id="sevWeak" data-s="weak">약</button>
      <button class="sev" id="sevNormal" data-s="normal">보통</button>
      <button class="sev" id="sevStrong" data-s="strong">강</button>
    </div>
  </div>

  <div class="controls">
    <div class="joy" id="joy" role="group" aria-label="집게 조이스틱 — 좌우로 밀거나 화살표 키로 집게를 옮겨요">
      <div class="joy-halo"></div>
      <div class="joy-plate">
        <div class="joy-gate">
          <span class="joy-arrow l">◀</span>
          <span class="joy-arrow r">▶</span>
        </div>
      </div>
      <div class="joy-collar"></div>
      <div class="joy-stick" id="stick">
        <div class="joy-rod" id="rod"></div>
        <div class="joy-ball" id="ball"></div>
      </div>
    </div>
    <button id="drop">집기!<span class="sub">SPACE</span></button>
  </div>

  <div class="bottom">
    <button class="mini" id="refill">🪙 코인 무료 충전 +10</button>
    <button class="mini" id="book">📖 내 인형 도감</button>
  </div>
</div>

<div id="toast"></div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h2>📖 내 인형 도감</h2>
      <button id="bookClose" aria-label="닫기">✕</button>
    </div>
    <div class="progress" id="bookProgress"></div>
    <div class="grid" id="bookGrid"></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var TAU = Math.PI * 2;
  var STORAGE_KEY = 'claw_machine_sion_v1';

  /* =========================================================
     1. PLUSHIE TYPES
     ========================================================= */
  var TYPES = [
    { id:'bear',    name:'곰돌이',  rarity:'일반', points:100, scale:1.00 },
    { id:'rabbit',  name:'토끼',    rarity:'일반', points:120, scale:0.95 },
    { id:'cat',     name:'고양이',  rarity:'일반', points:120, scale:0.94 },
    { id:'chick',   name:'병아리',  rarity:'일반', points:100, scale:0.86 },
    { id:'frog',    name:'개구리',  rarity:'일반', points:130, scale:0.92 },
    { id:'penguin', name:'펭귄',    rarity:'레어', points:170, scale:0.96 },
    { id:'dino',    name:'공룡',    rarity:'레어', points:180, scale:1.00 },
    { id:'shiba',   name:'시바견',  rarity:'레어', points:190, scale:0.96 },
    { id:'star',    name:'별',      rarity:'에픽', points:260, scale:0.90 },
    { id:'unicorn', name:'유니콘',  rarity:'에픽', points:320, scale:1.02 }
  ];
  var BY_ID = {};
  TYPES.forEach(function(t){ BY_ID[t.id] = t; });

  var SPAWN_TABLE = [
    ['bear',3],['rabbit',3],['cat',3],['chick',2.2],['frog',2.4],
    ['penguin',1.4],['dino',1.3],['shiba',1.2],['star',0.55],['unicorn',0.4]
  ];
  function pickType(){
    var total = 0, i;
    for(i=0;i<SPAWN_TABLE.length;i++) total += SPAWN_TABLE[i][1];
    var r = Math.random() * total;
    for(i=0;i<SPAWN_TABLE.length;i++){
      r -= SPAWN_TABLE[i][1];
      if(r <= 0) return SPAWN_TABLE[i][0];
    }
    return 'bear';
  }

  /* =========================================================
     1-b. CLAW STRENGTH PRESETS
     ========================================================= */
  var STRENGTHS = {
    weak: {
      key:'weak', name:'약', label:'약 · 실전 쫄깃', emoji:'😈', level:1, color:'#5fe0ff',
      base:0.88, errK:1.20, diffK:1.60, min:0.03, max:0.86,
      tension:0.14, grip:0.72, wobble:6.0, swing:0.20, lift:215, slipLo:0.24, slipHi:0.72
    },
    normal: {
      key:'normal', name:'보통', label:'보통 · 표준', emoji:'🎯', level:2, color:'#c3aaff',
      base:0.96, errK:0.85, diffK:1.10, min:0.05, max:0.96,
      tension:0.05, grip:0.90, wobble:3.4, swing:0.14, lift:255, slipLo:0.32, slipHi:0.78
    },
    strong: {
      key:'strong', name:'강', label:'강 · 꽉 잡힘', emoji:'💪', level:3, color:'#ffe066',
      base:0.98, errK:0.50, diffK:0.55, min:0.10, max:0.98,
      tension:0.0, grip:1.0, wobble:1.6, swing:0.08, lift:285, slipLo:0.15, slipHi:0.45
    }
  };

  function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }
  function baseR(){ return Math.max(20, Math.min(32, W * 0.071)); }

  function layout(){
    floorY = H - 84;
    chuteW = Math.min(86, Math.max(62, W * 0.20));
    chuteX = 12;
    chuteC = chuteX + chuteW / 2;
    clawMinX = chuteC;
    clawMaxX = W - 34;
    pileLeft = chuteX + chuteW + 20;
    pileRight = W - 22;
    claw.x = clamp(claw.x || (chuteC + (W - chuteC) * 0.62), clawMinX, clawMaxX);
    claw.y = clamp(claw.y, TOP_Y, floorY - 30);
    var br = baseR();
    for(var i=0;i<plushies.length;i++){
      var p = plushies[i];
      p.r = br * BY_ID[p.type].scale;
      p.x = clamp(p.x, pileLeft + p.r*0.2, pileRight - p.r*0.2);
      p.y = Math.min(p.y, floorY - p.r*0.5);
    }
  }

  var sized = false;
  function resize(){
    var rect = stage.getBoundingClientRect();
    var nw = Math.max(240, Math.round(rect.width));
    var nh = Math.max(220, Math.round(rect.height));
    if(sized && nw === W && nh === H) return;
    sized = true;
    W = nw; H = nh;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  }

  /* =========================================================
     3. SOUND (Web Audio, synthesised)
     ========================================================= */
  var Sound = (function(){
    var ac = null, master = null, motor = null, enabled = true, lastThud = 0;

    function ensure(){
      if(!ac){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        try{ ac = new AC(); }catch(e){ return null; }
        master = ac.createGain();
        master.gain.value = enabled ? 0.34 : 0;
        master.connect(ac.destination);
      }
      if(ac.state === 'suspended' && ac.resume) ac.resume();
      return ac;
    }

    function tone(o){
      var c = ensure();
      if(!c || !enabled) return;
      var f = o.f, t = o.t || 0.15, type = o.type || 'sine', v = (o.v === undefined ? 0.3 : o.v), to = o.to || null, d = o.d || 0;
      var osc = c.createOscillator(), g = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f, c.currentTime + d);
      if(to) osc.frequency.exponentialRampToValueAtTime(Math.max(24, to), c.currentTime + d + t);
      g.gain.setValueAtTime(0.0001, c.currentTime + d);
      g.gain.exponentialRampToValueAtTime(Math.max(0.001, v), c.currentTime + d + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + d + t);
      osc.connect(g); g.connect(master);
      osc.start(c.currentTime + d);
      osc.stop(c.currentTime + d + t + 0.06);
    }

    function noise(dur, v, freq, d){
      var c = ensure();
      if(!c || !enabled) return;
      var len = Math.max(1, Math.floor(c.sampleRate * dur));
      var buf = c.createBuffer(1, len, c.sampleRate);
      var data = buf.getChannelData(0);
      for(var i=0;i<len;i++) data[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 1.6);
      var src = c.createBufferSource(); src.buffer = buf;
      var bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 1.1;
      var g = c.createGain(); g.gain.value = v;
      src.connect(bp); bp.connect(g); g.connect(master);
      src.start(c.currentTime + (d || 0));
    }

    return {
      unlock: ensure,
      setMuted: function(m){
        enabled = !m;
        if(master) master.gain.value = m ? 0 : 0.34;
        if(m && motor){ try{ motor.o.stop(); }catch(e){} motor = null; }
      },
      coin: function(){ tone({f:1046,t:0.05,type:'square',v:0.18}); tone({f:1568,t:0.09,type:'square',v:0.14,d:0.06}); },
      deny: function(){ tone({f:180,t:0.12,type:'square',v:0.16,to:120}); },
      clack: function(){ noise(0.09,0.26,2400,0); tone({f:220,t:0.09,type:'triangle',v:0.16,to:150}); },
      grabGood: function(){ tone({f:520,t:0.1,type:'triangle',v:0.18,to:700}); },
      creak: function(){ tone({f:340,t:0.22,type:'sawtooth',v:0.08,to:260}); },
      slip: function(){ tone({f:440,t:0.16,type:'triangle',v:0.2,to:200}); tone({f:220,t:0.28,type:'triangle',v:0.18,to:120,d:0.14}); },
      release: function(){ noise(0.14,0.18,1200,0); },
      thud: function(){
        var now = 0;
        try{ now = (window.performance && performance.now()) ? performance.now() : Date.now(); }catch(e){ now = Date.now(); }
        if(now - lastThud < 110) return;
        lastThud = now;
        tone({f:130,t:0.13,type:'sine',v:0.16,to:70});
        noise(0.06,0.10,420,0);
      },
      win: function(){
        var notes = [784, 988, 1175, 1568];
        for(var i=0;i<notes.length;i++){
          tone({f:notes[i], t:0.16, type:'triangle', v:0.2, d:i*0.075});
        }
        tone({f:2349, t:0.5, type:'sine', v:0.07, d:0.3});
        noise(0.2, 0.10, 5200, 0.02);
      },
      motorOn: function(on){
        var c = ensure();
        if(!c || !enabled) return;
        if(on){
          if(motor) return;
          var o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 56;
          var lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320;
          var g = c.createGain(); g.gain.value = 0.0001;
          o.connect(lp); lp.connect(g); g.connect(master); o.start();
          g.gain.linearRampToValueAtTime(0.055, c.currentTime + 0.1);
          motor = { o:o, g:g };
        } else if(motor){
          var m = motor; motor = null;
          try{
            m.g.gain.cancelScheduledValues(c.currentTime);
            m.g.gain.setValueAtTime(m.g.gain.value, c.currentTime);
            m.g.gain.linearRampToValueAtTime(0.0001, c.currentTime + 0.08);
            m.o.stop(c.currentTime + 0.12);
          }catch(e){}
        }
      }
    };
  })();

  function ball(g, x, y, r, light, dark, ry){
    var grd = g.createRadialGradient(x - r*0.34, y - r*0.44, Math.max(1, r*0.12), x, y, r*1.16);
    grd.addColorStop(0, light);
    grd.addColorStop(1, dark);
    g.fillStyle = grd;
    g.beginPath();
    g.ellipse(x, y, r, (ry === undefined ? r*1.02 : ry), 0, 0, TAU);
    g.fill();
    g.strokeStyle = 'rgba(48,20,62,0.26)';
    g.lineWidth = Math.max(1, r*0.055);
    g.stroke();
  }
  function dot(g, x, y, rx, ry, fill){

    }
  }

      var ha = Math.PI*1.60;
      var hx = Math.cos(ha)*r*0.80, hy = Math.sin(ha)*r*0.80;
      var tipx = Math.cos(ha)*r*1.58, tipy = Math.sin(ha)*r*1.58;
      var hpx = -Math.sin(ha)*r*0.17, hpy = Math.cos(ha)*r*0.17;
      var hg = g.createLinearGradient(hx, hy, tipx, tipy);
      hg.addColorStop(0, '#ffd75e');
      hg.addColorStop(1, '#fff6c4');
      g.fillStyle = hg;
      g.beginPath();
      g.moveTo(hx + hpx, hy + hpy);
      g.lineTo(tipx, tipy);
      g.lineTo(hx - hpx, hy - hpy);
      g.closePath();
      g.fill();
      g.strokeStyle = 'rgba(196,132,20,0.5)';
      g.lineWidth = Math.max(1, r*0.04);
      g.stroke();
      /* body */
      ball(g, 0, 0, r*0.92, '#ffffff', '#e6def6');
      /* mane tufts over the crown */
      for(i=0;i<4;i++){
        var b = Math.PI*1.16 + i*0.22;
        var mx = Math.cos(b)*r*0.78, my = Math.sin(b)*r*0.78;
        dot(g, mx, my, r*0.205, r*0.20, cols[i]);
        dot(g, mx - r*0.03, my - r*0.05, r*0.075, r*0.06, 'rgba(255,255,255,0.5)');
      }
      /* face */
      dot(g, 0, r*0.34, r*0.40, r*0.30, '#fdf2ff');
      eyes(g, r, 0.33, -0.06, 0.088);
      g.fillStyle = 'rgba(196,150,220,0.8)';
      g.beginPath(); g.moveTo(-r*0.10, r*0.16); g.lineTo(r*0.10, r*0.16); g.lineTo(0, r*0.26); g.closePath(); g.fill();
      g.fillStyle = 'rgba(240,190,225,0.9)';
      g.beginPath(); g.moveTo(-r*0.16, r*0.10); g.lineTo(-r*0.09, r*0.02); g.lineTo(-r*0.02, r*0.10); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(r*0.16, r*0.10); g.lineTo(r*0.09, r*0.02); g.lineTo(r*0.02, r*0.10); g.closePath(); g.fill();
      blush(g, r, 0.85);
    }
  };

  /* sprite cache for fast drawing */
  var spriteCache = {};
  function getSprite(id, r){
    r = Math.round(r);
    var key = id + '|' + r;
    var hit = spriteCache[key];
    if(hit) return hit;
    var size = Math.ceil(r * 3.1) + 10;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var c = document.createElement('canvas');
    c.width = Math.round(size * dpr);
    c.height = Math.round(size * dpr);
    var g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.translate(size/2, size/2 + r*0.03);
    ART[id](g, r);
    var entry = { canvas: c, size: size };
    spriteCache[key] = entry;
    return entry;
  }

  /* =========================================================
     5. GAME ENTITIES
     ========================================================= */
  function makePlushie(id, x, y){

  function spawnInitial(){

    var base = ['bear','rabbit','cat','chick','frog','penguin','dino','shiba'];
    for(var i = base.length - 1; i > 0; i--){

      var tmp = base[i]; base[i] = base[j]; base[j] = tmp;

  /* =========================================================
     6. PARTICLES / FLOATING TEXT
     ========================================================= */
  function confetti(x, y, n){
    var cols = ['#ff5fa2','#5fe0ff','#ffe066','#a97bff','#7bff9e','#ff9d5c','#ff4d6d'];
    for(var i=0;i<n;i++){
      var a = Math.random() * TAU;
      var sp = 80 + Math.random() * 330;
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 140,
        g: 940,
        t: 0,
        life: 0.9 + Math.random() * 0.8,
        size: 3 + Math.random() * 5,
        rot: Math.random() * TAU,
        vr: (Math.random() - 0.5) * 15,
        color: cols[(Math.random() * cols.length) | 0],
        circle: Math.random() < 0.35
      });
    }
  }

  function updateParts(dt){
    for(var i=parts.length-1;i>=0;i--){
      var p = parts[i];
      p.t += dt;
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.99;
      p.rot += p.vr * dt;
      if(p.t >= p.life || p.y > H + 60) parts.splice(i, 1);
    }
  }

  function drawParts(){
    for(var i=0;i<parts.length;i++){
      var p = parts[i];
      var a = 1 - p.t / p.life;
      ctx.save();
      ctx.globalAlpha = Math.max(0, a);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if(p.circle){
        ctx.beginPath(); ctx.arc(0, 0, p.size*0.55, 0, TAU); ctx.fill();
      } else {
        ctx.fillRect(-p.size/2, -p.size*0.34, p.size, p.size*0.68);
      }
      ctx.restore();
    }
  }

  function floatText(text, x, y, color){
    floats.push({ text: text, x: x, y: y, t: 0, life: 1.2, color: color });
  }

  function updateFloats(dt){
    for(var i=floats.length-1;i>=0;i--){
      var f = floats[i];
      f.t += dt;
      f.y -= 34 * dt;
      if(f.t >= f.life) floats.splice(i, 1);
    }
  }

  function drawFloats(){
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for(var i=0;i<floats.length;i++){
      var f = floats[i];
      var a = 1 - f.t / f.life;
      ctx.globalAlpha = Math.max(0, a);
      ctx.font = '900 18px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(30,8,50,0.7)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.restore();
  }

  /* =========================================================
     7. PHYSICS
     ========================================================= */
  function stepPlushies(dt){
    var i, j, p, a, b;
    var collR = 0.82;

    for(i=0;i<plushies.length;i++){
      p = plushies[i];
      if(p.held) continue;
      p.vy += 1500 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= (1 - 2.4 * dt);
      p.rot += p.rotV * dt;
      p.rotV *= (1 - 3.4 * dt);
      if(!p.inChute && p.y + p.r*0.92 > floorY){
        p.y = floorY - p.r*0.92;
        if(p.vy > 150){ p.vy = -p.vy * 0.26; Sound.thud(); }
        else { p.vy = 0; }
        p.vx *= 0.82;
        p.rot *= 0.91;
      }
    }

    for(i=0;i<plushies.length;i++){
      a = plushies[i];
      if(a.inChute) continue;
      for(j=i+1;j<plushies.length;j++){
        b = plushies[j];
        if(b.inChute || a.held || b.held) continue;
        var dx = b.x - a.x, dy = b.y - a.y;
        var d = Math.sqrt(dx*dx + dy*dy);
        var min = (a.r + b.r) * collR;
        if(d < min){
          if(d < 0.001){ d = 0.001; dx = 0.001; dy = -0.4; }
          var nx = dx/d, ny = dy/d;
          var push = (min - d) * 0.5;
          a.x -= nx * push; a.y -= ny * push;
          b.x += nx * push; b.y += ny * push;
          var rel = (b.vx - a.vx)*nx + (b.vy - a.vy)*ny;
          if(rel < 0){
            var imp = rel * 0.45;
            a.vx += nx * imp; a.vy += ny * imp;
            b.vx -= nx * imp; b.vy -= ny * imp;
          }
        }
      }
    }

    for(i=plushies.length-1;i>=0;i--){
      p = plushies[i];
      if(p.held) continue;
      if(p.inChute){
        if(p.y > floorY + 46) catchPlushie(p, i);
        continue;
      }
      if(p.x < pileLeft + p.r*0.12){ p.x = pileLeft + p.r*0.12; p.vx = Math.abs(p.vx) * 0.35; }
      if(p.x > pileRight - p.r*0.12){ p.x = pileRight - p.r*0.12; p.vx = -Math.abs(p.vx) * 0.35; }
      if(p.y + p.r*0.92 > floorY){ p.y = floorY - p.r*0.92; }
      if(p.y < -220) p.y = -220;
      if(p.x !== p.x || p.y !== p.y){ p.x = (pileLeft + pileRight)/2; p.y = floorY - p.r; }
    }
  }

  /* =========================================================
     8. CLAW STATE MACHINE
     ========================================================= */
  function topUnderClaw(){
    var best = null;
    for(var i=0;i<plushies.length;i++){
      var p = plushies[i];
      if(p.inChute) continue;
      if(Math.abs(p.x - claw.x) > p.r * 0.92) continue;
      if(!best || (p.y - p.r) < (best.y - best.r)) best = p;
    }
    return best;
  }

  function grabCandidate(){
    var best = null, bd = 1e9;
    for(var i=0;i<plushies.length;i++){
      var p = plushies[i];
      if(p.inChute) continue;
      var dx = Math.abs(p.x - claw.x);
      if(dx > p.r * 1.05) continue;
      var dy = Math.abs(p.y - (claw.y + CLAW_TIP));
      if(dy > p.r * 1.6) continue;
      var d = dx + dy * 0.4;
      if(d < bd){ bd = d; best = p; }
    }
    return best;
  }

  function startDrop(){
    if(phase !== 'idle') return;
    if(state.coins <= 0){
      Sound.deny();
      toast('코인이 없어! 무료 충전을 눌러줘 🪙');
      var rb = document.getElementById('refill');
      rb.classList.add('hot');
      rb.classList.remove('pulse');
      void rb.offsetWidth;
      rb.classList.add('pulse');
      return;
    }
    state.coins--;
    updateHud();
    Sound.coin();
    claw.vx = 0;
    roundStrength = state.strength;
    claw.closeAt = (1 - strengthCfg(roundStrength).grip) * 0.5;
    phase = 'drop';
    elT = 0;
    document.getElementById('drop').classList.add('busy');
  }

  function resolveGrab(){
    var p = grabCandidate();
    Sound.clack();
    if(!p){
      toast('허공을 잡았다! 😅');
      phase = 'lift';
      elT = 0;
      return;
    }
    var err = Math.abs(p.x - claw.x) / p.r;
    var diff = p.rarity === '에픽' ? 0.10 : (p.rarity === '레어' ? 0.05 : 0);
    var cfg = strengthCfg(roundStrength);
    var chance = clamp(cfg.base - err * cfg.errK - diff * cfg.diffK, cfg.min, cfg.max);
    var ok = Math.random() < chance;
    /* 실전 쫄깃: 잘 잡혔어도 끌어올리다 한 번 놓칠 수 있음 */
    if(ok && cfg.tension > 0 && Math.random() < cfg.tension) ok = false;

    p.held = true;
    p.vx = 0; p.vy = 0;
    p.rotV = 0;
    p.inChute = false;
    claw.held = p;

    if(ok){
      slipAt = null;
      Sound.grabGood();
    } else {
      slipAt = TOP_Y + (claw.y - TOP_Y) * (cfg.slipLo + Math.random() * (cfg.slipHi - cfg.slipLo));
      Sound.creak();
    }
    phase = 'lift';
    elT = 0;
  }

  function slipNow(){
    var p = claw.held;
    if(!p) return;
    claw.held = null;
    p.held = false;
    p.rotV = (Math.random() - 0.5) * 5;
    p.vx = (Math.random() - 0.5) * 80;
    p.vy = 30;
    slipAt = null;
    Sound.slip();
    toast('앗, 미끄러졌다! 😭');
    floatText('앗!', p.x, p.y - p.r - 6, '#ff9ecb');
  }

  function releaseHeld(){
    var p = claw.held;
    if(!p) return;
    claw.held = null;
    p.held = false;
    p.inChute = true;
    p.x = chuteC;
    p.vx = 0;
    p.vy = 90;
    p.rot = 0;
    p.rotV = 0;
    Sound.release();
  }

  function catchPlushie(p, idx){
    plushies.splice(idx, 1);
    var t = BY_ID[p.type];
    state.score += t.points;
    state.collection[p.type] = (state.collection[p.type] || 0) + 1;
    store.save();
    tray.push(p.type);
    if(tray.length > 3) tray.shift();
    confetti(chuteC + 4, floorY + 22, 48);
    floatText('+' + t.points, chuteC + 30, floorY - 6, '#ffe066');
    Sound.win();
    toast(t.name + ' 획득! +' + t.points + '점 🎉');
    updateHud();
    refreshBook();
    pendingRestock = 0.85;
  }

  function updateClaw(dt){
    if(phase === 'idle'){
      var axis = joyAxis();          /* -1..1 · 조이스틱을 민 만큼만 */
      if(axis){
        claw.vx += (axis * 215 - claw.vx) * Math.min(1, dt * 18);
      } else {
        claw.vx -= claw.vx * Math.min(1, dt * 13);
      }
      claw.vx = clamp(claw.vx, -215, 215);
      claw.x += claw.vx * dt;
      if(claw.x <= clawMinX){ claw.x = clawMinX; claw.vx = 0; }
      if(claw.x >= clawMaxX){ claw.x = clawMaxX; claw.vx = 0; }
      claw.prong += (1 - claw.prong) * Math.min(1, dt * 9);
    }
  }

  function updatePhase(dt){
    elT += dt;
    var p, t;

    if(phase === 'drop'){
      var hit = topUnderClaw();
      var limit = hit ? Math.max(TOP_Y, hit.y - hit.r * 0.55) : (floorY - 30);
      var spd = 340;
      claw.y = Math.min(limit, claw.y + spd * dt);
      if(claw.y >= limit - 0.6){
        claw.y = limit;
        phase = 'close';
        elT = 0;
      }
    }
    else if(phase === 'close'){
      t = Math.min(1, elT / 0.34);
      claw.prong = 1 - t * (1 - claw.closeAt);
      if(t >= 1){
        claw.prong = claw.closeAt;
        resolveGrab();
      }
    }
    else if(phase === 'lift'){
      var lcfg = strengthCfg(roundStrength);
      claw.y -= lcfg.lift * dt;
      if(claw.held){
        p = claw.held;
        var wob = Math.sin(elT * 21) * lcfg.wobble * Math.min(1, elT * 3.5);
        p.x = claw.x + wob * 0.55;
        p.y = claw.y + CLAW_TIP + p.r * 0.16;
        p.rot = Math.sin(elT * 13.5) * lcfg.swing;
        if(slipAt !== null && claw.y <= slipAt) slipNow();
      }
      if(claw.y <= TOP_Y){
        claw.y = TOP_Y;
        if(claw.held){ phase = 'move'; elT = 0; }
        else { phase = 'settle'; elT = 0; }
      }
    }
    else if(phase === 'move'){
      var dx = chuteC - claw.x;
      var step = Math.sign(dx) * Math.min(Math.abs(dx), 270 * dt);
      claw.x += step;
      if(claw.held){
        claw.held.x = claw.x;
        claw.held.y = claw.y + CLAW_TIP + claw.held.r * 0.16;
      }
      if(Math.abs(chuteC - claw.x) < 1.5){
        claw.x = chuteC;
        phase = 'open';
        elT = 0;
      }
    }
    else if(phase === 'open'){
      t = Math.min(1, elT / 0.28);
      claw.prong = claw.closeAt + t * (1 - claw.closeAt);
      if(claw.held && t > 0.42) releaseHeld();
      if(t >= 1){
        claw.prong = 1;
        phase = 'settle';
        elT = 0;
      }
    }
    else if(phase === 'settle'){
      claw.prong += (1 - claw.prong) * Math.min(1, dt * 10);
      if(elT > 0.3){
        phase = 'idle';
        elT = 0;
        document.getElementById('drop').classList.remove('busy');
      }
    }
  }

  /* =========================================================
     9. RENDER
     ========================================================= */
  function roundRect(g, x, y, w, h, r){
    var rr = Math.min(r, w/2, h/2);
    g.beginPath();
    g.moveTo(x + rr, y);
    g.lineTo(x + w - rr, y);
    g.quadraticCurveTo(x + w, y, x + w, y + rr);
    g.lineTo(x + w, y + h - rr);
    g.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    g.lineTo(x + rr, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - rr);
    g.lineTo(x, y + rr);
    g.quadraticCurveTo(x, y, x + rr, y);
    g.closePath();
  }

  function drawBackWall(now){
    var bg = ctx.createLinearGradient(0, 0, 0, floorY);
    bg.addColorStop(0, '#2a1454');
    bg.addColorStop(0.5, '#1d0e3c');
    bg.addColorStop(1, '#3a1b66');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, floorY);

    var spot = ctx.createRadialGradient(W*0.58, floorY*0.30, 8, W*0.58, floorY*0.48, W*0.92);
    spot.addColorStop(0, 'rgba(255,190,255,0.16)');
    spot.addColorStop(1, 'rgba(255,190,255,0)');
    ctx.fillStyle = spot;
    ctx.fillRect(0, 0, W, floorY);

    /* neon vertical strips */
    var strip = ctx.createLinearGradient(0, 0, 0, floorY);
    strip.addColorStop(0, 'rgba(255,95,200,0.55)');
    strip.addColorStop(0.6, 'rgba(120,90,255,0.18)');
    strip.addColorStop(1, 'rgba(95,224,255,0.35)');
    ctx.fillStyle = strip;
    ctx.fillRect(4, 54, 3.5, floorY - 54);
    ctx.fillRect(W - 7.5, 54, 3.5, floorY - 54);

    /* faint dot grid on the back wall (depth) */
    ctx.save();
    ctx.globalAlpha = 0.055;
    ctx.fillStyle = '#ffffff';
    for(var gy = 62; gy < floorY - 10; gy += 24){
      var off = (Math.floor((gy - 62) / 24) % 2) ? 11 : 0;
      for(var gx2 = 14 + off; gx2 < W - 8; gx2 += 22){
        ctx.beginPath();
        ctx.arc(gx2, gy, 1.05, 0, TAU);
        ctx.fill();
      }
    }
    ctx.restore();

    /* ceiling light cone */
    var cone = ctx.createLinearGradient(0, 46, 0, floorY);
    cone.addColorStop(0, 'rgba(255,236,255,0.15)');
    cone.addColorStop(0.45, 'rgba(255,220,255,0.055)');
    cone.addColorStop(1, 'rgba(255,220,255,0)');
    ctx.beginPath();
    ctx.moveTo(W*0.40, 44);
    ctx.lineTo(W*0.60, 44);
    ctx.lineTo(W*1.04, floorY);
    ctx.lineTo(-W*0.04, floorY);
    ctx.closePath();
    ctx.fillStyle = cone;
    ctx.fill();

    /* faint star specks */
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for(var i=0;i<18;i++){
      var sx = (i * 137.5) % W;
      var sy = 60 + ((i * 91.3) % Math.max(40, floorY - 90));
      var tw = 0.25 + 0.75 * Math.abs(Math.sin(now * 1.3 + i));
      ctx.globalAlpha = tw * 0.45;
      ctx.fillRect(sx, sy, 1.6, 1.6);
    }
    ctx.restore();
  }

  function drawFloor(){
    var fg = ctx.createLinearGradient(0, floorY, 0, floorY + 16);
    fg.addColorStop(0, '#7a4bb5');
    fg.addColorStop(0.35, '#4a2a7a');
    fg.addColorStop(1, '#281448');
    ctx.fillStyle = fg;
    ctx.fillRect(0, floorY, W, 16);

    ctx.fillStyle = 'rgba(255,215,255,0.55)';
    ctx.fillRect(0, floorY - 1.5, W, 2);

    ctx.fillStyle = 'rgba(20,8,38,0.55)';
    ctx.fillRect(0, floorY + 16, W, 4);
  }

  function drawChute(){
    /* hole */
    var g1 = ctx.createLinearGradient(0, floorY - 4, 0, floorY + 30);
    g1.addColorStop(0, '#0a0316');
    g1.addColorStop(0.3, '#170a2c');
    g1.addColorStop(1, '#05020c');
    ctx.fillStyle = g1;
    ctx.beginPath();
    roundRect(ctx, chuteX, floorY - 5, chuteW, 40, 6);
    ctx.fill();

    /* rim highlight */
    ctx.strokeStyle = 'rgba(180,150,255,0.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(chuteX, floorY - 4);
    ctx.lineTo(chuteX + chuteW, floorY - 4);
    ctx.stroke();

    /* divider wall between chute and pile */
    var wg = ctx.createLinearGradient(chuteX + chuteW, 0, chuteX + chuteW + 8, 0);
    wg.addColorStop(0, '#8f78d6');
    wg.addColorStop(1, '#4a2f80');
    ctx.fillStyle = wg;
    ctx.beginPath();
    roundRect(ctx, chuteX + chuteW - 1, floorY - 26, 7, 30, 3);
    ctx.fill();

    /* inner glow of chute */
    ctx.save();
    ctx.globalAlpha = 0.5;
    var gl = ctx.createRadialGradient(chuteC, floorY + 4, 2, chuteC, floorY + 4, chuteW*0.7);
    gl.addColorStop(0, 'rgba(95,224,255,0.35)');
    gl.addColorStop(1, 'rgba(95,224,255,0)');
    ctx.fillStyle = gl;
    ctx.fillRect(chuteX - 6, floorY - 20, chuteW + 12, 50);
    ctx.restore();
  }

  function drawTray(now){
    var ty = floorY + 20;
    var tw = Math.min(W * 0.46, chuteW + 96);
    var th = H - ty - 6;
    if(th < 12) return;

    var tg = ctx.createLinearGradient(0, ty, 0, ty + th);
    tg.addColorStop(0, 'rgba(80,50,130,0.85)');
    tg.addColorStop(1, 'rgba(22,10,40,0.9)');
    ctx.fillStyle = tg;
    ctx.beginPath();
    roundRect(ctx, 8, ty, tw, th, 10);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,190,255,0.28)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    /* glow inside tray */
    ctx.save();
    var gl = ctx.createRadialGradient(8 + tw*0.5, ty + th*0.5, 2, 8 + tw*0.5, ty + th*0.5, tw*0.75);
    gl.addColorStop(0, 'rgba(255,230,150,0.20)');
    gl.addColorStop(1, 'rgba(255,230,150,0)');
    ctx.fillStyle = gl;
    ctx.fillRect(8, ty, tw, th);
    ctx.restore();

    /* mini caught plushies */
    var mr = Math.min(th*0.34, 15);
    for(var i=0;i<tray.length;i++){
      var spr = getSprite(tray[i], mr);
      var bx = 8 + tw*0.30 + (i - (tray.length-1)/2) * (mr * 2.1);
      var by = ty + th*0.52;
      ctx.save();
      ctx.globalAlpha = 0.95;
      ctx.drawImage(spr.canvas, bx - spr.size/2, by - spr.size/2, spr.size, spr.size);
      ctx.restore();
    }

    /* label */
    ctx.save();
    ctx.globalAlpha = 0.5 + Math.sin(now*2.2)*0.12;
    ctx.fillStyle = '#ffe066';
    ctx.font = '900 8px system-ui,sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('PRIZE', 16, ty + 10);
    ctx.restore();
  }

  function drawPanel(now){
    var ty = floorY + 20;
    var tw = Math.min(W * 0.46, chuteW + 96);
    var px = 8 + tw + 8;
    var pw = W - px - 8;
    var th = H - ty - 6;
    if(pw < 60 || th < 12) return;

    ctx.save();
    var pg = ctx.createLinearGradient(px, ty, px + pw, ty + th);
    pg.addColorStop(0, 'rgba(255,95,200,0.10)');
    pg.addColorStop(1, 'rgba(95,224,255,0.10)');
    ctx.fillStyle = pg;
    ctx.beginPath();
    roundRect(ctx, px, ty, pw, th, 10);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.14)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var cy = ty + th/2;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '900 10px system-ui,sans-serif';
    ctx.fillText('1 PLAY · 1 COIN', px + pw/2, cy - th*0.14);
    ctx.globalAlpha = 0.55 + Math.sin(now*2.6)*0.2;
    ctx.fillStyle = '#5fe0ff';
    ctx.font = '800 8px system-ui,sans-serif';
    ctx.fillText('ALIGN & GRAB', px + pw/2, cy + th*0.18);
    ctx.restore();
  }

  function drawItem(p, now){
    var bobb = p.held ? 0 : Math.sin(now * 2.1 + p.seed) * 0.018;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.scale(1, 1 + bobb);
    var spr = getSprite(p.type, p.r);
    ctx.drawImage(spr.canvas, -spr.size/2, -spr.size/2, spr.size, spr.size);
    ctx.restore();

    if(p.rarity === '에픽' && !p.inChute){
      ctx.save();
      ctx.globalAlpha = 0.35 + Math.sin(now * 4 + p.seed) * 0.25;
      ctx.strokeStyle = '#ffe066';
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r*1.12, 0, TAU); ctx.stroke();
      ctx.restore();
    }
  }

  function drawProng(sign, ang){
    ctx.save();
    ctx.translate(sign * 9.0, 10);
    ctx.rotate(-sign * ang);
    var g = ctx.createLinearGradient(0, 0, 0, 30);
    g.addColorStop(0, '#f6f1ff');
    g.addColorStop(0.42, '#b9aae4');
    g.addColorStop(1, '#6a5a99');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-5.6, 0);
    ctx.quadraticCurveTo(-8.6, 15, -2.0, 27.5);
    ctx.quadraticCurveTo(2.6, 29.6, 3.0, 25.0);
    ctx.quadraticCurveTo(-1.4, 14, 3.4, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(26,8,46,0.5)';
    ctx.lineWidth = 1.1;
    ctx.stroke();
    /* edge highlight */
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(-4.4, 2.5);
    ctx.quadraticCurveTo(-6.8, 14, -1.6, 25);
    ctx.stroke();
    ctx.restore();
  }

  function drawClaw(){
    /* rail */
    var rg = ctx.createLinearGradient(0, RAIL_Y - 8, 0, RAIL_Y + 8);
    rg.addColorStop(0, '#eae4ff');
    rg.addColorStop(0.35, '#a294d6');
    rg.addColorStop(0.7, '#5f4f92');
    rg.addColorStop(1, '#3b2a63');
    ctx.fillStyle = rg;
    ctx.beginPath();
    roundRect(ctx, 5, RAIL_Y - 7, W - 10, 13, 6);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.30)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.save();
    ctx.translate(claw.x, 0);

    /* cable */
    var sway = Math.sin(simTime * 3.2) * (Math.abs(claw.vx) / 215) * 2.2;
    ctx.strokeStyle = 'rgba(210,196,255,0.9)';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(0, RAIL_Y + 4);
    ctx.quadraticCurveTo(sway, (RAIL_Y + claw.y) / 2, 0, claw.y);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(120,100,180,0.6)';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(1.2, RAIL_Y + 4);
    ctx.quadraticCurveTo(sway + 1.2, (RAIL_Y + claw.y) / 2, 1.2, claw.y);
    ctx.stroke();

    /* trolley */
    var tg = ctx.createLinearGradient(-17, 0, 17, 0);
    tg.addColorStop(0, '#5b478c');
    tg.addColorStop(0.42, '#d9d0ff');
    tg.addColorStop(1, '#4b3a7c');
    ctx.fillStyle = tg;
    ctx.beginPath();
    roundRect(ctx, -17, RAIL_Y - 3, 34, 17, 6);
    ctx.fill();
    ctx.strokeStyle = 'rgba(28,10,48,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();

    /* 집게 강도 표시: 트롤리 위 3단 게이지 */
    var sc = strengthCfg(state.strength);
    for(var gi = 0; gi < 3; gi++){
      var lit = gi < sc.level;
      if(lit){
        ctx.save();
        ctx.shadowColor = sc.color;
        ctx.shadowBlur = 6;
        ctx.fillStyle = sc.color;
        ctx.beginPath(); ctx.arc(-13 + gi*5, RAIL_Y + 9, 1.9, 0, TAU); ctx.fill();
        ctx.restore();
      } else {
        ctx.fillStyle = 'rgba(38,22,66,0.6)';
        ctx.beginPath(); ctx.arc(-13 + gi*5, RAIL_Y + 9, 1.9, 0, TAU); ctx.fill();
      }
    }

    /* claw body */
    ctx.save();
    ctx.translate(0, claw.y);
    ctx.scale(CLAW_SCALE, CLAW_SCALE);
    drawProng(-1, 0.10 + claw.prong * 0.60);
    drawProng(1, 0.10 + claw.prong * 0.60);

    var cg = ctx.createLinearGradient(-14, 0, 14, 0);
    cg.addColorStop(0, '#6b5a9e');
    cg.addColorStop(0.4, '#f2ecff');
    cg.addColorStop(1, '#5b4a90');
    ctx.fillStyle = cg;
    ctx.beginPath();
    roundRect(ctx, -15.5, -6, 31, 19, 7);
    ctx.fill();
    ctx.strokeStyle = 'rgba(28,10,48,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    roundRect(ctx, -9.5, -3.5, 19, 4.5, 2);
    ctx.fill();

    /* 집게 강도 LED */
    var lc = strengthCfg(state.strength);
    ctx.save();
    ctx.shadowColor = lc.color;
    ctx.shadowBlur = 9 + lc.level * 3.5;
    ctx.fillStyle = lc.color;
    ctx.beginPath();
    ctx.arc(0, 12.5, 2.3 + lc.level * 0.55, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(-0.7, 11.8, 0.9, 0, TAU); ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  function render(now){
    ctx.clearRect(0, 0, W, H);
    drawBackWall(now);
    drawFloor();
    drawChute();
    drawTray(now);
    drawPanel(now);

    var list = plushies.slice().sort(function(a, b){ return a.y - b.y; });
    for(var i=0;i<list.length;i++) drawItem(list[i], now);

    drawClaw();
    drawParts();
    drawFloats();
  }

  /* =========================================================
     10. LOOP
     ========================================================= */
  var keys = { left: false, right: false };
  var lastT = 0;

  function update(dt){
    updateJoy(dt);
    if(pendingRestock > 0){
      pendingRestock -= dt;
      if(pendingRestock <= 0){
        if(plushies.length < 8){
          if(phase === 'idle'){ pendingRestock = 0; spawnOne(); }
          else { pendingRestock = 0.3; }
        } else {
          pendingRestock = 0;
        }
      }
    }
    updatePhase(dt);
    updateClaw(dt);
    stepPlushies(dt);
    updateParts(dt);
    updateFloats(dt);

    var moving = (phase === 'idle' && Math.abs(claw.vx) > 28) ||
                 phase === 'drop' || phase === 'lift' || phase === 'move';
    Sound.motorOn(moving);
  }

  function frame(ts){
    var dt = lastT ? (ts - lastT) / 1000 : 0.016;
    lastT = ts;
    dt = clamp(dt, 0.001, 0.034);
    simTime += dt;
    update(dt);
    render(simTime);
    requestAnimationFrame(frame);
  }

      card.className = 'card';

      c.style.height = size + 'px';
      var g = c.getContext('2d');

  /* ------- 아케이드 조이스틱 ------- */
  var joyEl  = document.getElementById('joy');
  var ballEl = document.getElementById('ball');
  var rodEl  = document.getElementById('rod');

  var JOY_REST    = 48;   /* 받침 중심 → 공 중심 (가운데) */
  var JOY_MOVE_X  = 34;   /* 공이 움직일 수 있는 최대 좌우 거리(px) */
  var JOY_MOVE_DN = 16;   /* 아래로 밀었을 때 */
  var JOY_MOVE_UP = 12;   /* 위로 당겼을 때 */
  var JOY_PUSH    = 44;   /* 이만큼 밀면 최대 */

  /* ax = 집게로 넘기는 좌우 입력(-1..1), tx/ty = 손가락이 민 양(-1..1) */
  var joy = { ax: 0, tx: 0, ty: 0, bx: 0, by: 0, down: false, id: null, sx: 0, sy: 0 };
  var joyDrawnX = -999, joyDrawnY = -999;

  function drawJoy(force){
    var bx = joy.bx, by = joy.by;
    if(!force && Math.abs(bx - joyDrawnX) < 0.02 && Math.abs(by - joyDrawnY) < 0.02) return;
    joyDrawnX = bx; joyDrawnY = by;

    var cy = -JOY_REST + by;
    ballEl.style.transform = 'translate(' + bx.toFixed(2) + 'px,' + cy.toFixed(2) + 'px)';
    var len = Math.sqrt(bx * bx + cy * cy) - 16;
    if(len < 8) len = 8;
    rodEl.style.height = len.toFixed(1) + 'px';
    rodEl.style.transform = 'rotate(' + (Math.atan2(bx, -cy) * 180 / Math.PI).toFixed(2) + 'deg)';

    joyEl.style.setProperty('--lx', Math.max(0, Math.min(1, -bx / JOY_MOVE_X)).toFixed(3));
    joyEl.style.setProperty('--rx', Math.max(0, Math.min(1,  bx / JOY_MOVE_X)).toFixed(3));
    joyEl.style.setProperty('--mag', Math.min(1, Math.sqrt(bx * bx + by * by) / (JOY_MOVE_X * 0.7)).toFixed(3));
  }

  /* 부드럽게 따라가고, 손을 떼면 스스르르 중앙으로 */
  function updateJoy(dt){
    var pushed = joy.down ? joy.tx : ((keys.left ? -1 : 0) + (keys.right ? 1 : 0));
    if(pushed > 1) pushed = 1; else if(pushed < -1) pushed = -1;

    var k = 1 - Math.exp(-(joy.down ? 42 : 17) * dt);
    joy.ax += (pushed - joy.ax) * k;
    if(Math.abs(joy.ax) < 0.0015) joy.ax = 0;

    joy.bx = joy.ax * JOY_MOVE_X;
    if(joy.down){
      joy.by = joy.ty > 0 ? joy.ty * JOY_MOVE_DN : joy.ty * JOY_MOVE_UP;
    } else {
      joy.by -= joy.by * Math.min(1, dt * 14);
      if(Math.abs(joy.by) < 0.05) joy.by = 0;
    }
    drawJoy(false);
  }

  /* 살짝 빈틈(데드존)을 두고, 작게 밀면 천천히 */
  function joyAxis(){
    var a = joy.ax, m = a < 0 ? -a : a;
    if(m < 0.09) return 0;
    var n = (m - 0.09) / 0.91;
    return (a < 0 ? -1 : 1) * Math.pow(n, 1.3);
  }

  function joyMoveTo(cx, cy){
    var dx = cx - joy.sx, dy = cy - joy.sy;
    var d = Math.sqrt(dx * dx + dy * dy);
    if(d > JOY_PUSH){ dx = dx * JOY_PUSH / d; dy = dy * JOY_PUSH / d; }
    joy.tx = dx / JOY_PUSH;
    joy.ty = dy / JOY_PUSH;
  }

  function joyPress(cx, cy, id){
    Sound.unlock();
    joy.down = true; joy.id = id;
    joy.sx = cx; joy.sy = cy;
    joy.tx = 0; joy.ty = 0;
    joyEl.classList.add('dragging');
    drawJoy(true);
  }

  function joyRelease(e){
    if(!joy.down) return;
    if(e && e.pointerId !== undefined && e.pointerId !== joy.id) return;
    joy.down = false;
    joy.tx = 0; joy.ty = 0;
    joyEl.classList.remove('dragging');
    try{ if(e && e.pointerId !== undefined && joyEl.releasePointerCapture) joyEl.releasePointerCapture(e.pointerId); }catch(err){}
    joy.id = null;
  }

  joyEl.addEventListener('pointerdown', function(e){
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    if(joy.down) return;
    joyPress(e.clientX, e.clientY, e.pointerId);
    try{ joyEl.setPointerCapture(e.pointerId); }catch(err){}
    if(e.cancelable) e.preventDefault();
  });
  joyEl.addEventListener('pointermove', function(e){
    if(!joy.down || e.pointerId !== joy.id) return;
    joyMoveTo(e.clientX, e.clientY);
    if(e.cancelable) e.preventDefault();
  });
  joyEl.addEventListener('pointerup', joyRelease);
  joyEl.addEventListener('pointercancel', joyRelease);
  joyEl.addEventListener('lostpointercapture', function(){ joyRelease(null); });
  joyEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  /* fallback for browsers without PointerEvent */
  if(!window.PointerEvent){
    joyEl.addEventListener('touchstart', function(e){
      var t = e.changedTouches[0]; if(!t || joy.down) return;
      joyPress(t.clientX, t.clientY, t.identifier);
      e.preventDefault();
    }, { passive: false });
    joyEl.addEventListener('touchmove', function(e){
      if(!joy.down) return;
      for(var i = 0; i < e.changedTouches.length; i++){
        var t = e.changedTouches[i];
        if(t.identifier === joy.id){ joyMoveTo(t.clientX, t.clientY); e.preventDefault(); break; }
      }
    }, { passive: false });
    joyEl.addEventListener('touchend', joyRelease);
    joyEl.addEventListener('touchcancel', joyRelease);
  }

  });

  document.addEventListener('pointerdown', function(){ Sound.unlock(); }, { once: true });
  window.addEventListener('blur', function(){
    keys.left = false; keys.right = false;
    joyRelease(null);
  });

  /* =========================================================
     13. BOOT
     ========================================================= */
  function boot(){
    store.load();
    if(state.muted) muteBtn.textContent = '🔇';
    Sound.setMuted(state.muted);
    markStrength();

    resize();
    if(!plushies.length) spawnInitial();
    layout();
    buildBook();
    refreshBook();
    updateHud();
    claw.x = pileLeft + (pileRight - pileLeft) * 0.5;
    claw.y = TOP_Y;
    drawJoy(true);

    if(window.ResizeObserver){
      try{ new ResizeObserver(function(){ resize(); }).observe(stage); }catch(e){}
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function(){ setTimeout(resize, 220); });

    requestAnimationFrame(frame);
    setTimeout(function(){ toast('조이스틱을 밀어 집게를 옮기고, 집기! 를 눌러봐 🎪', 2600); }, 700);
  }

  boot();
})();
</script>
</body>
</html>
